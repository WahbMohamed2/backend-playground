<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DevBoard</title>
  <script async crossorigin="anonymous" data-clerk-publishable-key="pk_test_dmVyaWZpZWQtc3BpZGVyLTU0LmNsZXJrLmFjY291bnRzLmRldiQ" src="https://verified-spider-54.clerk.accounts.dev/npm/@clerk/clerk-js@latest/dist/clerk.browser.js" type="text/javascript"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #1e1e2e;
      --accent: #7c6af7;
      --accent2: #e879a0;
      --text: #e8e8f0;
      --muted: #5a5a7a;
      --success: #4ade80;
      --danger: #f87171;
      --warning: #fbbf24;
    }

    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(124,106,247,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124,106,247,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Glow orbs */
    body::after {
      content: '';
      position: fixed;
      top: -200px;
      right: -200px;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(124,106,247,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    #root { position: relative; z-index: 1; }

    /* ─── LOGIN SCREEN ─── */
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      animation: fadeIn 0.6s ease;
    }

    .logo {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -2px;
      margin-bottom: 0.5rem;
    }

    .logo span { color: var(--accent); }

    .tagline {
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 3rem;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
    }

    .login-card h2 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .login-card p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    #clerk-mount {
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ─── APP SCREEN ─── */
    #app-screen {
      display: none;
      min-height: 100vh;
      flex-direction: column;
    }

    /* Header */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-logo {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .header-logo span { color: var(--accent); }

    .header-user {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 0.4rem 1rem 0.4rem 0.4rem;
    }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      color: white;
    }

    .user-name {
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* Main layout */
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      padding: 2rem;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
    }

    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; }
    }

    /* Panels */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .panel-header {
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-title {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .panel-body { padding: 1.5rem; }

    /* Form */
    .form-group { margin-bottom: 1rem; }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }

    input, select, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 0.9rem;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    textarea { resize: vertical; min-height: 70px; }

    select option { background: var(--surface); }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.65rem 1.4rem;
      border-radius: 8px;
      border: none;
      font-family: 'Syne', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover { background: #6b59e8; transform: translateY(-1px); }
    .btn-primary:active { transform: translateY(0); }

    .btn-danger {
      background: transparent;
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 0.3rem 0.7rem;
      width: auto;
      font-size: 0.75rem;
    }

    .btn-danger:hover { background: rgba(248,113,113,0.1); }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    /* Task list */
    #task-list { display: flex; flex-direction: column; gap: 0.75rem; }

    .task-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.2rem;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      animation: slideIn 0.3s ease;
      transition: border-color 0.2s;
    }

    .task-item:hover { border-color: var(--accent); }

    .task-info { flex: 1; min-width: 0; }

    .task-title {
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.4rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-meta {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-todo     { background: rgba(90,90,122,0.3); color: var(--muted); }
    .badge-in_progress { background: rgba(124,106,247,0.2); color: var(--accent); }
    .badge-done     { background: rgba(74,222,128,0.15); color: var(--success); }
    .badge-low      { background: rgba(74,222,128,0.1); color: var(--success); }
    .badge-medium   { background: rgba(251,191,36,0.1); color: var(--warning); }
    .badge-high     { background: rgba(248,113,113,0.15); color: var(--danger); }

    .task-actions { flex-shrink: 0; }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-size: 0.85rem;
      font-family: 'JetBrains Mono', monospace;
    }

    .empty-icon { font-size: 2rem; margin-bottom: 0.5rem; }

    /* Response box */
    #response-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--success);
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 200px;
      overflow-y: auto;
      display: none;
      margin-top: 1rem;
      line-height: 1.6;
    }

    /* Token display */
    .token-display {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--accent);
      word-break: break-all;
      line-height: 1.5;
      margin-bottom: 1rem;
    }

    .token-label {
      font-size: 0.65rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.4rem;
    }

    /* Logout */
    .btn-logout {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.4rem 1rem;
      border-radius: 8px;
      font-family: 'Syne', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

    /* Alerts */
    .alert {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.82rem;
      margin-bottom: 1rem;
      display: none;
    }

    .alert-error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: var(--danger); }
    .alert-success { background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.3); color: var(--success); }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }

    .loading { opacity: 0.5; pointer-events: none; }
  </style>
</head>
<body>
<div id="root">

  <!-- LOGIN SCREEN -->
  <div id="login-screen">
    <div class="logo">Dev<span>Board</span></div>
    <div class="tagline">Task tracker for developers</div>
    <div class="login-card">
      <h2>Sign in to continue</h2>
      <p>Authenticate with Clerk to access your tasks and projects.</p>
      <div id="clerk-mount"></div>
    </div>
  </div>

  <!-- APP SCREEN -->
  <div id="app-screen">
    <header>
      <div class="header-logo">Dev<span>Board</span></div>
      <div class="header-user">
        <div class="user-badge">
          <div class="avatar" id="user-avatar">?</div>
          <span class="user-name" id="user-name">Loading...</span>
        </div>
        <button class="btn-logout" onclick="handleLogout()">Sign out</button>
      </div>
    </header>

    <main>

      <!-- LEFT: Create Task + Token -->
      <div style="display:flex;flex-direction:column;gap:1.5rem;">

        <!-- Token panel -->
        <div class="panel">
          <div class="panel-header">
            <span class="panel-title">🔑 Your JWT Token</span>
          </div>
          <div class="panel-body">
            <div class="token-label">Use this in Swagger → Authorize</div>
            <div class="token-display" id="token-display">Fetching token...</div>
            <button class="btn btn-ghost" onclick="copyToken()">Copy Token</button>
          </div>
        </div>

        <!-- Create task panel -->
        <div class="panel">
          <div class="panel-header">
            <span class="panel-title">➕ Create Task</span>
          </div>
          <div class="panel-body">
            <div class="alert alert-error" id="create-error"></div>
            <div class="form-group">
              <label>Title</label>
              <input type="text" id="task-title" placeholder="What needs to be done?" />
            </div>
            <div class="form-group">
              <label>Description</label>
              <textarea id="task-desc" placeholder="Optional details..."></textarea>
            </div>
            <div class="form-group">
              <label>Priority</label>
              <select id="task-priority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
              </select>
            </div>
            <button class="btn btn-primary" onclick="createTask()">Create Task</button>
            <div id="response-box"></div>
          </div>
        </div>
      </div>

      <!-- RIGHT: Task list -->
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">📋 My Tasks</span>
          <div style="display:flex;gap:0.5rem;">
            <select id="filter-status" style="width:auto;padding:0.3rem 0.6rem;font-size:0.75rem;" onchange="loadTasks()">
              <option value="">All Status</option>
              <option value="todo">Todo</option>
              <option value="in_progress">In Progress</option>
              <option value="done">Done</option>
            </select>
            <select id="filter-priority" style="width:auto;padding:0.3rem 0.6rem;font-size:0.75rem;" onchange="loadTasks()">
              <option value="">All Priority</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
        </div>
        <div class="panel-body">
          <div id="task-list">
            <div class="empty">
              <div class="empty-icon">⚡</div>
              Loading tasks...
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>

</div>

<script>
  const PUBLISHABLE_KEY = "pk_test_dmVyaWZpZWQtc3BpZGVyLTU0LmNsZXJrLmFjY291bnRzLmRldiQ";
  const API_BASE = "http://127.0.0.1:8000";
  let currentToken = null;

  // ─── INIT CLERK ───
  async function initClerk() {
    // New Clerk JS uses Clerk global loaded via script, init with publishableKey
    await window.Clerk.load({ publishableKey: PUBLISHABLE_KEY });
    const clerk = window.Clerk;
    window.__clerk = clerk;

    if (clerk.user) {
      await showApp(clerk);
    } else {
      document.getElementById("login-screen").style.display = "flex";
      clerk.mountSignIn(document.getElementById("clerk-mount"));
    }

    clerk.addListener(async ({ user }) => {
      if (user) await showApp(clerk);
    });
  }

  async function showApp(clerk) {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app-screen").style.display = "flex";

    const user = clerk.user;
    const initials = (user.firstName?.[0] || user.emailAddresses[0].emailAddress[0]).toUpperCase();
    document.getElementById("user-avatar").textContent = initials;
    document.getElementById("user-name").textContent =
      user.firstName ? `${user.firstName} ${user.lastName || ""}`.trim() : user.emailAddresses[0].emailAddress;

    // Get token
    try {
      currentToken = await clerk.session.getToken();
      const short = currentToken.slice(0, 40) + "..." + currentToken.slice(-20);
      document.getElementById("token-display").textContent = short;
      document.getElementById("token-display").title = currentToken;
    } catch (e) {
      document.getElementById("token-display").textContent = "Could not fetch token";
    }

    await loadTasks();
  }

  async function handleLogout() {
    await window.__clerk.signOut();
    window.location.reload();
  }

  function copyToken() {
    if (!currentToken) return;
    navigator.clipboard.writeText(currentToken);
    const btn = event.target;
    btn.textContent = "Copied!";
    setTimeout(() => btn.textContent = "Copy Token", 2000);
  }

  // ─── API HELPERS ───
  async function apiCall(method, path, body = null) {
    if (!currentToken) {
      currentToken = await window.__clerk.session.getToken();
    }
    const opts = {
      method,
      headers: {
        "Authorization": `Bearer ${currentToken}`,
        "Content-Type": "application/json"
      }
    };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(API_BASE + path, opts);
    return { status: res.status, data: res.status === 204 ? null : await res.json() };
  }

  // ─── TASKS ───
  async function loadTasks() {
    const status = document.getElementById("filter-status").value;
    const priority = document.getElementById("filter-priority").value;
    let url = "/tasks/?limit=50";
    if (status) url += `&status=${status}`;
    if (priority) url += `&priority=${priority}`;

    try {
      const { data } = await apiCall("GET", url);
      renderTasks(data);
    } catch (e) {
      document.getElementById("task-list").innerHTML =
        `<div class="empty"><div class="empty-icon">⚠️</div>Could not load tasks.<br/>Is your FastAPI server running?</div>`;
    }
  }

  function renderTasks(tasks) {
    const list = document.getElementById("task-list");
    if (!tasks || tasks.length === 0) {
      list.innerHTML = `<div class="empty"><div class="empty-icon">✨</div>No tasks yet.<br/>Create one to get started.</div>`;
      return;
    }
    list.innerHTML = tasks.map(task => `
      <div class="task-item" id="task-${task.id}">
        <div class="task-info">
          <div class="task-title">${escapeHtml(task.title)}</div>
          <div class="task-meta">
            <span class="badge badge-${task.status}">${task.status.replace("_", " ")}</span>
            <span class="badge badge-${task.priority}">${task.priority}</span>
          </div>
          ${task.description ? `<div style="color:var(--muted);font-size:0.78rem;margin-top:0.4rem;font-family:'JetBrains Mono',monospace;">${escapeHtml(task.description)}</div>` : ''}
        </div>
        <div class="task-actions" style="display:flex;flex-direction:column;gap:0.4rem;align-items:flex-end;">
          <select onchange="updateStatus(${task.id}, this.value)" style="width:auto;padding:0.25rem 0.5rem;font-size:0.72rem;">
            <option value="todo" ${task.status==='todo'?'selected':''}>Todo</option>
            <option value="in_progress" ${task.status==='in_progress'?'selected':''}>In Progress</option>
            <option value="done" ${task.status==='done'?'selected':''}>Done</option>
          </select>
          <button class="btn btn-danger" onclick="deleteTask(${task.id})">Delete</button>
        </div>
      </div>
    `).join('');
  }

  async function createTask() {
    const title = document.getElementById("task-title").value.trim();
    const description = document.getElementById("task-desc").value.trim();
    const priority = document.getElementById("task-priority").value;
    const errorEl = document.getElementById("create-error");
    const responseBox = document.getElementById("response-box");

    errorEl.style.display = "none";

    if (!title) {
      errorEl.textContent = "Title is required.";
      errorEl.style.display = "block";
      return;
    }

    try {
      const { status, data } = await apiCall("POST", "/tasks/", { title, description: description || null, priority });
      responseBox.style.display = "block";
      if (status === 201) {
        responseBox.style.color = "var(--success)";
        responseBox.textContent = "✅ Created:\n" + JSON.stringify(data, null, 2);
        document.getElementById("task-title").value = "";
        document.getElementById("task-desc").value = "";
        await loadTasks();
      } else {
        responseBox.style.color = "var(--danger)";
        responseBox.textContent = "❌ Error:\n" + JSON.stringify(data, null, 2);
      }
    } catch (e) {
      errorEl.textContent = "Could not reach API. Is the server running?";
      errorEl.style.display = "block";
    }
  }

  async function updateStatus(taskId, newStatus) {
    try {
      await apiCall("PUT", `/tasks/${taskId}`, { status: newStatus });
      await loadTasks();
    } catch (e) {
      alert("Failed to update task.");
    }
  }

  async function deleteTask(taskId) {
    try {
      await apiCall("DELETE", `/tasks/${taskId}`);
      const el = document.getElementById(`task-${taskId}`);
      if (el) { el.style.opacity = "0"; el.style.transform = "translateX(20px)"; el.style.transition = "all 0.3s"; }
      setTimeout(() => loadTasks(), 300);
    } catch (e) {
      alert("Failed to delete task.");
    }
  }

  function escapeHtml(str) {
    return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  window.addEventListener("load", initClerk);
</script>
</body>
</html>
